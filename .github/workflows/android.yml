name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        working-directory: android
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SMM-Tafsiir.apk
      - uses: actions/upload-artifact@v4
        with: { name: SMM-Tafsiir-apk, path: SMM-Tafsiir.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk SMM-Tafsiir.apk --title "SMM Tafsiir APK (build ${{ github.run_number }})" --notes "Test build. Download SMM-Tafsiir.apk on your phone and install it." --latest
